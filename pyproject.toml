[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpjax"
version = "0.1.0"
description = "JAX/Flax implementation for deep-potential"
readme = "README_JAX.md"
requires-python = ">=3.10"
authors = [{ name = "deep-potential contributors" }]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "jax>=0.4.25",
  "jaxlib>=0.4.25",
  "flax>=0.8.2",
  "optax>=0.2.2",
  "chex>=0.1.86",
  "diffrax>=0.5.0",
]

[project.optional-dependencies]
operations = [
  "h5py>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "orbax-checkpoint>=0.5.0",
]
notebook = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "nbstripout>=0.6",
]
tracking = [
  "wandb>=0.16",
  "tensorboard>=2.14",
  "tensorboardX>=2.6",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpjax*", "experiments*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
