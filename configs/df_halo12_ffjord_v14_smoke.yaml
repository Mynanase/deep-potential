# Halo12 FFJORD v14-smoke — Quick validation run (attempt 2)
# v14-smoke-v1 was killed by early stopping at step 225 because p99 hit 30.
# Key observations from v14-smoke-v1:
# - NLL dropped nicely: 8.44 → 6.17 (train), 8.42 → 6.09 (val)
# - But score exploded: p99 3.38 → 32, smax 7.68 → 61
# - reg=1e-5 is too weak for this data scale, even with asinh transform
#
# Strategy: increase reg to moderate level, relax early stopping for smoke.
# Paper uses 1e-5, but their data is normalized to ~[-1,1] range.
# Our asinh+standardization puts data std ~0.4 (spatial) and ~1 (velocity after norm),
# so kinematic quantities may still be large.

seed: 42

data:
  dataset: eta
  val_frac: 0.1
  transform:
    type: asinh
    dims: [0, 1, 2]
    scale: auto

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes: [128, 128]
    n_blocks: 1
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 4096
    rtol: 1.0e-5
    atol: 1.0e-5
    trace_type: exact
    kin_reg: 1.0e-2
    jac_reg: 1.0e-2

train:
  batch_size: 4096
  epochs: 3
  lr:
    schedule: plateau
    max: 1.0e-3
    final: 5.0e-6
    warmup_frac: 0.1
    plateau:
      factor: 0.5
      patience: 200
      min_delta: 0.01
      min_lr: 5.0e-6
  grad_clip: 1.0
  log_every: 25
  ckpt_every: 0
  max_to_keep: 2
  multi_gpu: true
  # Relaxed early stopping for smoke test
  stop_score_p99: 100.0
  stop_score_max_abs: 5000.0