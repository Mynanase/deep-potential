# Halo12 FFJORD v18 — Cosine decay instead of constant lr
# v15/v16/v17 all collapse during constant-lr phase (edge-of-stability).
# v17 survived 225 steps at constant lr=1e-4 before collapsing.
# Root cause: model sharpens during descent, Hessian λ_max crosses 2/lr boundary.
# Fix: never hold lr constant — cosine decay ensures lr always decreasing,
#   which follows the loss landscape curvature and stays inside the stable region.
seed: 42

data:
  dataset: eta
  val_frac: 0.1
  clip_sigma: 4.5
  jitter_std: 0.01
  transform:
    type: asinh
    dims: [0, 1, 2]
    scale: auto

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes: [192, 192, 192, 192, 192, 192]
    n_blocks: 3
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 16384
    rtol: 1.0e-5
    atol: 1.0e-5
    trace_type: exact
    kin_reg: 1.0e-3
    jac_reg: 1.0e-3

train:
  batch_size: 8192
  epochs: 30
  lr:
    schedule: cosine
    max: 1.0e-4
    final: 1.0e-6
    warmup_frac: 0.2
  grad_clip: 1.0
  log_every: 25
  ckpt_every: 500
  max_to_keep: 3
  multi_gpu: true
  stop_score_p99: 200.0
  stop_score_max_abs: 5000.0