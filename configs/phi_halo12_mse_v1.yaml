# Halo12 MSE baseline without output_scale.
#
# The network must learn the physical-scale potential (~57000 (km/s)^2)
# directly, which is harder to optimise. Used as a comparison to the
# output_scale variant (phi_halo12_static_v1.yaml).

seed: 42

data:
  dataset: eta

normalizer:
  eps: 1.0e-6

potential:
  hidden_sizes: [512, 512, 512, 512]

train:
  batch_size: 32768
  epochs: 128
  loss_type: mse
  alpha: 1.0
  beta: 1.0
  lambda_mass: 1.0
  mass_batch_size: 4096
  l2_reg: 0.001
  reweight:
    gamma: 0.0
    r_ref: 20.0
  lr:
    max: 0.003
    final: 1.0e-6
    warmup_frac: 0.03
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 500
  max_to_keep: 3
  multi_gpu: true