seed: 42

data:
  dataset: eta
  val_frac: 0.1
  jitter_std: 0.005

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes:
      - 256
      - 256
      - 256
    n_blocks: 2
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 16384
    rtol: 1.0e-6
    atol: 1.0e-6
    trace_type: exact
    kin_reg: 1.0
    jac_reg: 1.0

train:
  batch_size: 2048
  epochs: 32
  lr:
    max: 1.0e-4
    final: 1.0e-5
    warmup_frac: 0.1
  grad_clip: 0.1
  log_every: 25
  ckpt_every: 200
  max_to_keep: 40
  multi_gpu: true
  stop_score_p99: 30.0
  stop_score_max_abs: 500.0
