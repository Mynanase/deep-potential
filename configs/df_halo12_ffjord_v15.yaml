# Halo12 FFJORD v15 — Data quality fix
# Root cause of all v14 failures: outlier particles cause score explosion at step ~75-100.
# Green 2023 explicitly recommends truncating outliers (r < 10) and adding noise.
# Changes from v14:
#   1. clip_sigma=4.5 — remove samples beyond 4.5σ in ANY dimension (post-asinh)
#   2. jitter_std=0.01 — add Gaussian noise to smooth distribution boundary
#   3. reg=1e-3 (back to v14a value — clip+jitter should stabilize, no need for extra reg)
#   4. lr=5e-4 (compromise between v14a 1e-3 and v14c 3e-4)
#   5. rtol/atol=1e-5 (keep relaxed tolerance for ODE solver stability)
seed: 42

data:
  dataset: eta
  val_frac: 0.1
  clip_sigma: 4.5
  jitter_std: 0.01
  transform:
    type: asinh
    dims: [0, 1, 2]
    scale: auto

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes: [192, 192, 192, 192, 192, 192]
    n_blocks: 2
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 16384
    rtol: 1.0e-5
    atol: 1.0e-5
    trace_type: exact
    kin_reg: 1.0e-3
    jac_reg: 1.0e-3

train:
  batch_size: 8192
  epochs: 3
  lr:
    schedule: plateau
    max: 5.0e-4
    final: 5.0e-6
    warmup_frac: 0.1
    plateau:
      factor: 0.5
      patience: 200
      min_delta: 0.01
      min_lr: 5.0e-6
  grad_clip: 1.0
  log_every: 25
  ckpt_every: 100
  max_to_keep: 5
  multi_gpu: true
  stop_score_p99: 200.0
  stop_score_max_abs: 5000.0