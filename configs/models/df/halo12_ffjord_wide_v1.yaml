schema: dpjax.model.v1
kind: df

# Wide FFJORD recipe used by the former v21/v22 preprocessing ablations.
# Coordinate transforms now belong to the run YAML, not this model file.
normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes: [192, 192, 192, 192, 192, 192, 192, 192, 192, 192, 192, 192]
    n_blocks: 3
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 16384
    rtol: 1.0e-5
    atol: 1.0e-5
    trace_type: exact
    kin_reg: 1.0e-5
    jac_reg: 1.0e-5

train:
  optimizer: radam
  batch_size: 8192
  epochs: 20
  lr:
    schedule: cosine
    max: 1.0e-4
    final: 1.0e-6
    warmup_frac: 0.2
  grad_clip: 1.0
  stop_score_p99: 200.0
  stop_score_max_abs: 5000.0
