schema: dpjax.model.v1
kind: phi

potential:
  hidden_sizes: [512, 512, 512, 512]
  output_scale: 50000.0

train:
  optimizer: radam
  batch_size: 32768
  epochs: 192
  loss_type: mse
  alpha: 1.0
  beta: 10.0
  lambda_mass: 2000.0
  mass_batch_size: 4096
  mass_uniform_points: 4096
  mass_uniform_domain: cube
  mass_uniform_r_max: 75.0
  mass_uniform_weight: 1.0
  mass_uniform_weight_start: 0.1
  mass_uniform_ramp_frac: 0.5
  l2_reg: 0.001
  reweight:
    gamma: 0.0
    r_ref: 20.0
  lr:
    schedule: cosine
    max: 0.003
    final: 1.0e-6
    warmup_frac: 0.03
  grad_clip: 1.0
