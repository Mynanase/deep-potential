# Halo12 FFJORD v14 — reg sweep attempt 3
# Key changes from previous failed runs:
# - reg=1e-3 diverged at step ~300, reg=1e-2 diverged at step ~125
# - Root cause: score jumps at step ~75 when lr reaches peak
# - Solution: reduce lr (0.001 -> 0.0003), relax solver tol (1e-6 -> 1e-5),
#   keep reg=0.01
seed: 42

data:
  dataset: eta
  val_frac: 0.1
  transform:
    type: asinh
    dims: [0, 1, 2]
    scale: auto

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes: [192, 192, 192, 192, 192, 192]
    n_blocks: 2
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 16384
    rtol: 1.0e-5
    atol: 1.0e-5
    trace_type: exact
    kin_reg: 1.0e-2
    jac_reg: 1.0e-2

train:
  batch_size: 8192
  epochs: 3
  lr:
    schedule: plateau
    max: 3.0e-4
    final: 5.0e-6
    warmup_frac: 0.1
    plateau:
      factor: 0.5
      patience: 200
      min_delta: 0.01
      min_lr: 5.0e-6
  grad_clip: 1.0
  log_every: 25
  ckpt_every: 100
  max_to_keep: 5
  multi_gpu: true
  stop_score_p99: 200.0
  stop_score_max_abs: 5000.0