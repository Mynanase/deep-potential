# Plummer r-cut experiment — cut data (r >= 1.0 subset of the full data),
# modelling the Auriga scenario where central stars dominate the DF.
schema: dpjax.run.v2
name: cut-baseline
case: cut
output_dir: runs/plummer_rcut/cut-baseline

data:
  path: data/plummer_n524288_rcut1.0_train.h5
  dataset: eta
  split:
    validation_fraction: 0.25
    seed: 2024
  preprocessing:
    clip_sigma: 0.0
    transform:
      type: none
      dims: []

df:
  model: configs/models/df/plummer_ffjord_v1.yaml
  seed: 42
  model_overrides:
    train:
      epochs: 64

phi:
  model: configs/models/phi/plummer_mlp_v1.yaml
  seed: 42
  model_overrides:
    potential:
      hidden_sizes: [128, 128, 128]
    train:
      epochs: 128

logging:
  backend: csv
  project: deep-potential

execution:
  resume: false
  stages:
    df:
      multi_gpu: true
      log_every: 25
      checkpoint_every: 500
      checkpoints_to_keep: 3
    phi:
      multi_gpu: true
      log_every: 50
      checkpoint_every: 500
      checkpoints_to_keep: 3

evaluation:
  system: plummer
  df:
    enabled: true
    radial_edges: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 10.0]
    n_samples_per_model: 262144
    n_score_points: 32768
    score_batch_size: 1024
    seed: 42
    n_theta_bins: 6
    n_phi_bins: 8
    n_velocity_bins: 64
  phi:
    enabled: true
    gravitational_constant: 1.0
    n_eval: 32768
    batch_size: 4096
    seed: 0
    r_min: 0.001
    r_max: 10.0
    n_r: 256
    r_ref: 1.0
    compute_slice: true
    slice_grid: 128
    slice_rmax: 10.0

plots:
  formats: [png, pdf]
  dpi: 200
  df:
    dpi: 200
  phi:
    dpi: 200
