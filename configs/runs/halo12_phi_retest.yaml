# Reuse the existing v23_mass DF checkpoint (seed_43) and train only Phi.
schema: dpjax.run.v1
name: halo12_phi_retest
output_dir: runs/halo12_phi_retest

data:
  path: data/auriga/halo12_all_mass.h5
  dataset: eta
  weight_dataset: tracer_weight
  split:
    validation_fraction: 0.25
    seed: 1043
  preprocessing:
    clip_sigma: 4.5
    jitter_std: 0.002
    transform:
      type: none
      dims: []

trials:
  trial_00:
    df:
      model: configs/models/df/halo12_ffjord_compact_v1.yaml
      seed: 43
    phi:
      model: configs/models/phi/halo12_static_mlp_v1.yaml
      seed: 42

logging:
  backend: csv
  project: deep-potential

execution:
  resume: false
  stages:
    df:
      multi_gpu: false
      log_every: 25
      checkpoint_every: 500
      checkpoints_to_keep: 3
    phi:
      multi_gpu: false
      log_every: 50
      checkpoint_every: 500
      checkpoints_to_keep: 3

evaluation:
  system: halo
  df:
    enabled: false
  phi:
    enabled: true
    n_eval: 32768
    batch_size: 4096
    seed: 0
    r_min: 0.001
    r_max: 75.0
    n_r: 256
    r_ref: 20.0

plots:
  formats: [png]
  phi:
    dpi: 150
    plot_overview: true
    slice_grid: 128
    slice_rmax: 75.0

validation:
  auriga_truth:
    enabled: false
    n_eval: 65536
    batch_size: 4096
    seed: 0
    radial_bins: 12
