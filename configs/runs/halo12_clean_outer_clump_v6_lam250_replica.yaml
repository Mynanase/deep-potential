# R11 replica of halo12-clean-outer-clump-v6-lam250 (see docs/density_fluctuation_next_round.md R11).
# Only differences vs the historical run config:
#   - name / output_dir (new series; execution.resume: false)
#   - phi.df_run -> frozen read-only DF snapshot (v1/df, step 4800 only)
#   - phi checkpoint_every 200, checkpoints_to_keep 50 (capture the ramp phase, which
#     ends at ~step 950; the historical 500/3 kept only 9000/9500/9600)
# Everything else (model, seed, data, lambda_mass=250, beta=10, probes 16384 sphere,
# ramp 0.1, epochs 192, optimizer, lr, l2, eval, plots) is copied verbatim from
# configs/runs/halo12_clean_outer_clump_v6_lam250.yaml.
schema: dpjax.run.v2
name: halo12-clean-outer-clump-v6-lam250-replica
case: halo12
output_dir: runs/halo12/clean-outer-clump-v6-lam250-replica

data:
  path: data/auriga/halo12_all_mass_clean_outer_clump.h5
  dataset: eta
  weight_dataset: tracer_weight
  split:
    validation_fraction: 0.25
    seed: 1042
  preprocessing:
    clip_sigma: 0.0
    jitter_std: 0.002
    transform:
      type: none
      dims: []

df:
  model: configs/models/df/halo12_ffjord_compact_v1.yaml
  seed: 42

phi:
  model: configs/models/phi/halo12_static_mlp_v3_lam250.yaml
  seed: 42
  df_run: runs/halo12/df-snapshots/clean-outer-clump-v1-step4800

logging:
  backend: csv
  project: deep-potential

execution:
  resume: false
  stages:
    df:
      multi_gpu: true
      log_every: 25
      checkpoint_every: 500
      checkpoints_to_keep: 3
    phi:
      multi_gpu: true
      log_every: 50
      checkpoint_every: 200
      checkpoints_to_keep: 50

evaluation:
  system: halo
  df:
    enabled: false
    n_samples_per_model: 262144
    n_score_points: 32768
    score_batch_size: 1024
    seed: 42
    n_theta_bins: 6
    n_phi_bins: 8
    n_velocity_bins: 64
  phi:
    enabled: true
    n_eval: 32768
    batch_size: 4096
    seed: 0
    r_min: 0.001
    r_max: 75.0
    n_r: 256
    r_ref: 20.0
    compute_slice: true
    slice_grid: 128
    slice_rmax: 75.0

plots:
  formats: [png, pdf]
  dpi: 200
  display_units:
    length_unit: kpc
    velocity_unit: 'km\,s^{-1}'
    potential_unit: '(km\,s^{-1})^2'
  df:
    dpi: 200
  phi:
    dpi: 200
