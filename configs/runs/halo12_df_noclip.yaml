# Halo12 DF-only baseline WITHOUT sigma clipping.
# Control run to isolate the effect of the aggressive 4.5 sigma clip on
# outer-region DF fit quality. Everything else matches the best run
# (FFJORD compact, seed 43). Only the DF stage is trained here.
schema: dpjax.run.v2
name: halo12-df-noclip
case: halo12
output_dir: runs/halo12_df_noclip

data:
  path: data/auriga/halo12_all_mass.h5
  dataset: eta
  weight_dataset: tracer_weight
  split:
    validation_fraction: 0.25
    seed: 1043
  preprocessing:
    clip_sigma: 0.0          # ← sigma clip disabled
    jitter_std: 0.002
    transform:
      type: none
      dims: []

df:
  model: configs/models/df/halo12_ffjord_compact_v1.yaml
  seed: 43

# Phi stage is declared for schema compatibility only; it is NOT trained in
# this DF-only run (run only the `df` stage below).
phi:
  model: configs/models/phi/halo12_mse_no_output_scale_v1.yaml
  seed: 42

logging:
  backend: csv
  project: deep-potential

execution:
  resume: false
  stages:
    df:
      multi_gpu: false
      log_every: 25
      checkpoint_every: 500
      checkpoints_to_keep: 3
    phi:
      multi_gpu: false
      log_every: 50
      checkpoint_every: 500
      checkpoints_to_keep: 3

evaluation:
  system: halo
  df:
    enabled: true
    n_samples_per_model: 262144
    n_score_points: 32768
    score_batch_size: 1024
    seed: 42
    n_theta_bins: 6
    n_phi_bins: 8
    n_velocity_bins: 64
  phi:
    enabled: false   # not trained/run in this control

plots:
  formats: [png, pdf]
  dpi: 200
  display_units:
    length_unit: kpc
    velocity_unit: 'km\,s^{-1}'
    potential_unit: '(km\,s^{-1})^2'
  df:
    dpi: 200
  phi:
    dpi: 200
