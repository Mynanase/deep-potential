# One config for the complete Halo12 DF -> Phi -> evaluation run.
# Model hyperparameters stay in their existing stage-level YAML files.

name: halo12_static_v1
output_dir: runs/halo12_static_v1

data:
  path: data/auriga/halo12_all_mass.h5
  dataset: eta

trials:
  trial_00:
    df:
      config: configs/df_halo12_ffjord_v23_mass.yaml
      seed: 42
      overrides:
        data:
          split_seed: 1042
    phi:
      config: configs/phi_halo12_static_v1.yaml
      seed: 42

logging:
  backend: wandb
  project: deep-potential

execution:
  # Change to true only to continue matching checkpoints in this run directory.
  resume: false
  # Optional: select a subset without adding CLI arguments.
  # trials: [trial_00]

evaluation:
  system: halo
  df:
    enabled: true
    n_samples_per_model: 262144
    n_score_points: 32768
    score_batch_size: 1024
    n_theta_bins: 6
    n_phi_bins: 8
    n_velocity_bins: 64
    spatial_r_bins: 48
    spatial_z_bins: 48
    spatial_r_max: 75.0
    spatial_z_max: 75.0
    spatial_min_cell_count: 5
    seed: 42
    dpi: 150
    fig_formats: [png]
  phi:
    enabled: true
    n_eval: 32768
    batch_size: 4096
    seed: 0
    r_min: 0.001
    r_max: 75.0
    n_r: 256
    r_ref: 20.0
    plot_overview: true
    slice_grid: 128
    slice_rmax: 75.0
    dpi: 180
    fig_formats: [png]
  truth:
    # Enable only when the prepared mock contains potential/acceleration truth.
    enabled: false
    n_eval: 65536
    batch_size: 4096
    seed: 0
    radial_bins: 12
    plot_truth: true
    slice_phi_bins: 6
    slice_r_bins: 40
    slice_z_bins: 40
    slice_min_count: 3
    dpi: 180
    fig_formats: [png]
