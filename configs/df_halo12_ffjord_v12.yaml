seed: 42

data:
  dataset: eta
  val_frac: 0.1
  jitter_std: 0.005

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes:
      - 32
      - 32
    n_blocks: 1
    solver: dopri5
    stepsize_controller: pid
    dt0: 0.001
    max_steps: 16384
    rtol: 1.0e-6
    atol: 1.0e-6
    trace_type: exact
    kin_reg: 30.0
    jac_reg: 30.0

train:
  batch_size: 4096
  epochs: 24
  lr:
    max: 5.0e-6
    final: 5.0e-7
    warmup_frac: 0.1
  grad_clip: 0.005
  log_every: 25
  ckpt_every: 250
  max_to_keep: 30
  multi_gpu: true
  stop_score_p99: 15.0
  stop_score_max_abs: 100.0
